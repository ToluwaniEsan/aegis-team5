name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Run backend tests
        shell: bash
        run: |
          shopt -s globstar nullglob
          test_files=(tests/**/test_*.py tests/**/*_test.py)

          if [ "${#test_files[@]}" -gt 0 ]; then
            python -m pytest tests --junitxml=reports/pytest.xml
          else
            echo "No backend test files yet; tests skipped during initial setup."
          fi

      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-evidence
          path: backend/reports/pytest.xml
          if-no-files-found: warn

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check whether frontend exists
        id: frontend
        run: |
          if [ -d frontend ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend does not exist yet; checks skipped until C0."
          fi

      - uses: actions/setup-node@v6
        if: steps.frontend.outputs.exists == 'true'
        with:
          node-version: "22"

      - name: Install frontend dependencies
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run layout and accessibility checks
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/playwright.json
        run: npm run test:layout -- --reporter=line,json

      - name: Upload grayscale evidence
        if: always() && steps.frontend.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: grayscale-evidence
          path: |
            reports/grayscale/*.png
            frontend/reports/playwright.json
          if-no-files-found: warn

      - name: Check generated fixture literals
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: git diff --exit-code -- src/mock/fixtures.generated.ts

      - name: Check generated TypeScript schema
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: |
          npm run schema
          git diff --exit-code -- ../contracts/ui.from-ts.schema.json

  smoke:
    name: IRON HAWK smoke test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run short scenario
        run: >
          python -m aegis.testing.scenario_runner
          scenarios/iron_hawk_short.yaml
          --fast

      - name: Run full IRON HAWK scenario
        run: >
          python -m aegis.testing.scenario_runner
          scenarios/iron_hawk.yaml
          --fast

      - name: Run destination link loss scenario
        run: >
          python -m aegis.testing.scenario_runner
          scenarios/link_loss_at_destination.yaml
          --fast

      - name: Run E-STOP state and recovery scenario
        run: >
          python -m aegis.testing.scenario_runner
          scenarios/estop.yaml
          --fast

      - name: Run abort and return scenario
        run: >
          python -m aegis.testing.scenario_runner
          scenarios/abort_return.yaml
          --fast

      - name: Run injectable fault scenarios
        run: >
          python -m aegis.testing.scenario_runner
          scenarios/faults.yaml
          --fast

      - name: Run repeatability scenario
        run: >
          python -m aegis.testing.scenario_runner
          scenarios/repeatability.yaml
          --fast

      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-evidence
          path: |
            backend/reports/scenario-*.json
            logs/run-*.jsonl
          if-no-files-found: error

  verification:
    name: Verification report
    needs: [backend, frontend, smoke]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download pytest evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pytest-evidence
          path: backend/reports

      - name: Download browser evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: grayscale-evidence
          path: .

      - name: Download scenario evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: scenario-evidence
          path: .

      - name: Check evidence completeness
        id: evidence
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          if [[ "$BACKEND_RESULT" == success && "$FRONTEND_RESULT" == success && "$SMOKE_RESULT" == success ]] &&
             test -s backend/reports/pytest.xml &&
             test -s frontend/reports/playwright.json &&
             compgen -G 'backend/reports/scenario-*.json' > /dev/null; then
            echo 'incomplete=false' >> "$GITHUB_OUTPUT"
          else
            echo 'incomplete=true' >> "$GITHUB_OUTPUT"
            echo 'Evidence is incomplete; the report cannot establish PASS.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate verification report
        env:
          INCOMPLETE: ${{ steps.evidence.outputs.incomplete }}
        run: |
          if [[ "$INCOMPLETE" == true ]]; then
            python tools/verification_report.py --incomplete-inputs
          else
            python tools/verification_report.py
          fi

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: |
            reports/verification.md
            reports/verification.csv
          if-no-files-found: error

      - name: Fail when evidence is incomplete
        if: steps.evidence.outputs.incomplete == 'true'
        run: exit 1

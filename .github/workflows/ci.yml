name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Lint Python
        run: python -m ruff check .

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Run backend tests
        shell: bash
        run: |
          shopt -s globstar nullglob
          test_files=(tests/**/test_*.py tests/**/*_test.py)

          if [ "${#test_files[@]}" -gt 0 ]; then
            python -m pytest tests --junitxml=reports/pytest.xml
          else
            echo "No backend test files yet; tests skipped during initial setup."
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check whether frontend exists
        id: frontend
        run: |
          if [ -d frontend ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Frontend does not exist yet; checks skipped until C0."
          fi

      - uses: actions/setup-node@v6
        if: steps.frontend.outputs.exists == 'true'
        with:
          node-version: "22"

      - name: Install frontend dependencies
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test -- --run

      - name: Build frontend
        if: steps.frontend.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build

  smoke:
    name: IRON HAWK smoke test
    runs-on: ubuntu-latest

    # Remove this allowance when B15 is ready.
    continue-on-error: true

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run short scenario
        run: >
          python -m aegis.testing.scenario_runner
          scenarios/iron_hawk_short.yaml
          --fast
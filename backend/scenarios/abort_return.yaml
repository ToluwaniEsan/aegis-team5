name: abort_return
description: Abort before and after departure, and return after delivery.
steps:
- id: S01
  title: Start-up shows the link status
  reqs:
  - OI-007
  expect:
    within_s: 3
    snapshot:
      link.state: CONNECTED
      payload.state: EMPTY
      payload.updated_at:
        not: null
- id: S02
  title: Operator assigns a mission; payload ID generated by the system
  reqs:
  - OI-001
  - AEG-510
  ui:
    command: assign_mission
    confirmed: false
    args:
      origin_id: FOB_ALPHA
      destination_id: OP_BRAVO
      priority: PRIORITY
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
      prerelease_authorized: false
  expect:
    within_s: 2
    result:
      accepted: true
    snapshot:
      mission.active.payload_id:
        contains: PAY-
      mission.active.destination.id: OP_BRAVO
- id: S04
  title: Payload secured, weight within 0.5 kg, departure permitted
  reqs:
  - AEG-504
  - AEG-505
  - AEG-511
  expect:
    within_s: 8
    snapshot:
      payload.state: SECURED
      payload.secured: true
      payload.mass_kg:
        gt: 741.5
        lt: 742.5
      payload.departure_permitted: true
- id: A01
  title: Abort before departure unloads payload
  reqs:
  - OI-002
  ui:
    command: abort
    confirmed: true
    args: {}
  expect:
    within_s: 5
    result:
      accepted: true
    snapshot:
      payload.state: EMPTY
- id: BS02
  title: Operator assigns a mission; payload ID generated by the system
  reqs:
  - OI-001
  - AEG-510
  ui:
    command: assign_mission
    confirmed: false
    args:
      origin_id: FOB_ALPHA
      destination_id: OP_BRAVO
      priority: PRIORITY
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
      prerelease_authorized: false
  expect:
    within_s: 2
    result:
      accepted: true
    snapshot:
      mission.active.payload_id:
        contains: PAY-
      mission.active.destination.id: OP_BRAVO
- id: BS04
  title: Payload secured, weight within 0.5 kg, departure permitted
  reqs:
  - AEG-504
  - AEG-505
  - AEG-511
  expect:
    within_s: 8
    snapshot:
      payload.state: SECURED
      payload.secured: true
      payload.mass_kg:
        gt: 741.5
        lt: 742.5
      payload.departure_permitted: true
- id: BS07
  title: Vehicle departs
  reqs:
  - AEG-511
  inject:
    target: nav
    action: depart
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: TRAVELLING
      nav.moving: true
- id: A02
  title: Travel away from origin
  reqs:
  - OI-002
  wait_s: 3
- id: A03
  title: Abort while travelling
  reqs:
  - OI-002
  ui:
    command: abort
    confirmed: true
    args: {}
  expect:
    within_s: 3
    result:
      accepted: true
    snapshot:
      payload.state: RETURNING
- id: A04
  title: Return to origin with departure blocked
  reqs:
  - AEG-511
  expect:
    within_s: 10
    snapshot:
      payload.state: SECURED
      payload.departure_permitted: false
      nav.moving: false
- id: A05
  title: Unload after return
  reqs:
  - OI-002
  inject:
    target: payload
    action: unload
    params: {}
  expect:
    within_s: 5
    snapshot:
      payload.state: EMPTY
- id: CS02
  title: Operator assigns a mission; payload ID generated by the system
  reqs:
  - OI-001
  - AEG-510
  ui:
    command: assign_mission
    confirmed: false
    args:
      origin_id: FOB_ALPHA
      destination_id: OP_BRAVO
      priority: PRIORITY
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
      prerelease_authorized: false
  expect:
    within_s: 2
    result:
      accepted: true
    snapshot:
      mission.active.payload_id:
        contains: PAY-
      mission.active.destination.id: OP_BRAVO
- id: CS04
  title: Payload secured, weight within 0.5 kg, departure permitted
  reqs:
  - AEG-504
  - AEG-505
  - AEG-511
  expect:
    within_s: 8
    snapshot:
      payload.state: SECURED
      payload.secured: true
      payload.mass_kg:
        gt: 741.5
        lt: 742.5
      payload.departure_permitted: true
- id: CS07
  title: Vehicle departs
  reqs:
  - AEG-511
  inject:
    target: nav
    action: depart
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: TRAVELLING
      nav.moving: true
- id: CS21
  title: Vehicle arrives and stops at the destination
  reqs:
  - AEG-507
  inject:
    target: nav
    action: arrive
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: AT_DESTINATION
      nav.moving: false
      allowed.release.allowed: true
- id: CS22
  title: Operator confirms release; payload released and delivered
  reqs:
  - AEG-507
  - OI-003
  ui:
    command: release
    confirmed: true
    args: {}
  expect:
    within_s: 10
    result:
      accepted: true
    snapshot:
      payload.state: DELIVERED
- id: A06
  title: Return to origin after delivery
  reqs:
  - OI-002
  ui:
    command: return_to_origin
    confirmed: true
    args: {}
  expect:
    within_s: 3
    result:
      accepted: true
    snapshot:
      payload.state: DELIVERED
      nav.moving: true
- id: A07
  title: Arrive at origin after delivery
  reqs:
  - OI-002
  expect:
    within_s: 120
    snapshot:
      payload.state: DELIVERED
      nav.moving: false
      nav.position.lat: 34.7201
      nav.position.lon: -86.6402

name: repeatability
description: Repeated command lifecycles, interlocks, release refusals, and ten complete
  deliveries.
steps:
- id: S01
  title: Start-up shows the link status
  reqs:
  - OI-007
  expect:
    within_s: 3
    snapshot:
      link.state: CONNECTED
      payload.state: EMPTY
      payload.updated_at:
        not: null
- id: S02
  title: Operator assigns a mission; payload ID generated by the system
  reqs:
  - OI-001
  - AEG-510
  ui:
    command: assign_mission
    confirmed: false
    args:
      origin_id: FOB_ALPHA
      destination_id: OP_BRAVO
      priority: PRIORITY
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
      prerelease_authorized: false
  expect:
    within_s: 2
    result:
      accepted: true
    snapshot:
      mission.active.payload_id:
        contains: PAY-
      mission.active.destination.id: OP_BRAVO
- id: S04
  title: Payload secured, weight within 0.5 kg, departure permitted
  reqs:
  - AEG-504
  - AEG-505
  - AEG-511
  expect:
    within_s: 8
    snapshot:
      payload.state: SECURED
      payload.secured: true
      payload.mass_kg:
        gt: 741.5
        lt: 742.5
      payload.departure_permitted: true
- id: R_COMMANDS
  title: Complete 20 distinct payload update commands
  reqs:
  - OI-006
  repeat: 20
  ui:
    command: update_payload
    confirmed: false
    args:
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
  expect:
    within_s: 5
    result:
      accepted: true
    snapshot:
      commands.0.command: update_payload
      commands.0.state: COMPLETED
- id: R_SHIFT
  title: Make the payload unsecured
  reqs:
  - AEG-511
  inject:
    target: payload
    action: shift
    params:
      cm: 3.1
  expect:
    within_s: 2
    snapshot:
      payload.departure_permitted: false
- id: R_DEPART_REFUSED
  title: Unsecured payload blocks ten departure attempts
  reqs:
  - AEG-511
  repeat: 10
  inject:
    target: nav
    action: depart
    params: {}
  wait_s: 0.5
  expect:
    within_s: 2
    snapshot:
      payload.state: SECURED
      payload.departure_permitted: false
      nav.moving: false
- id: R_ACK_SHIFT
  title: Acknowledge shifted payload
  reqs:
  - AEG-502
  ui:
    command: ack_fault
    confirmed: false
    args:
      alert_id: $alert.PAYLOAD_SHIFT
  expect:
    within_s: 3
    alert:
      code: PAYLOAD_SHIFT
      acknowledged: true
- id: R_CLEAR_SHIFT
  title: Secure the payload
  reqs:
  - AEG-511
  inject:
    target: payload
    action: shift
    params:
      cm: 0.2
  expect:
    within_s: 3
    snapshot:
      payload.departure_permitted: true
- id: D01_DEPART
  title: Vehicle departs
  reqs:
  - AEG-511
  inject:
    target: nav
    action: depart
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: TRAVELLING
      nav.moving: true
- id: R_MOVING_RELEASE
  title: Refuse release while moving ten times
  reqs:
  - AEG-506
  repeat: 10
  ui:
    command: release
    confirmed: true
    args: {}
  expect:
    within_s: 2
    result:
      accepted: false
    snapshot:
      payload.state: TRAVELLING
      nav.moving: true
- id: D01_S21
  title: Vehicle arrives and stops at the destination
  reqs:
  - AEG-507
  inject:
    target: nav
    action: arrive
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: AT_DESTINATION
      nav.moving: false
      allowed.release.allowed: true
- id: D01_S22
  title: Operator confirms release; payload released and delivered
  reqs:
  - AEG-507
  - OI-003
  ui:
    command: release
    confirmed: true
    args: {}
  expect:
    within_s: 10
    result:
      accepted: true
    snapshot:
      payload.state: DELIVERED
- id: D01_S23
  title: Delivery confirmed within 10 s to the operator and Team 1, with a summary
  reqs:
  - AEG-508
  - OI-016
  - AEG-510
  expect:
    within_s: 3
    snapshot:
      delivery.confirm_latency_s:
        lt: 10
      delivery.payload_id:
        contains: PAY-
    log:
      kind: msg.sent
      env.type: t1.delivery_confirmation
      min_count: 1
- id: D02_S02
  title: Operator assigns a mission; payload ID generated by the system
  reqs:
  - OI-001
  - AEG-510
  ui:

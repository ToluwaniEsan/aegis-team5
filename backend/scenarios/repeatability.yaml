  - OI-001
  - AEG-510
  ui:
    command: assign_mission
    confirmed: false
    args:
      origin_id: FOB_ALPHA
      destination_id: OP_BRAVO
      priority: PRIORITY
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
      prerelease_authorized: false
  expect:
    within_s: 2
    result:
      accepted: true
    snapshot:
      mission.active.payload_id:
        contains: PAY-
      mission.active.destination.id: OP_BRAVO
- id: D10_S04
  title: Payload secured, weight within 0.5 kg, departure permitted
  reqs:
  - AEG-504
  - AEG-505
  - AEG-511
  expect:
    within_s: 8
    snapshot:
      payload.state: SECURED
      payload.secured: true
      payload.mass_kg:
        gt: 741.5
        lt: 742.5
      payload.departure_permitted: true
- id: D10_DEPART
  title: Vehicle departs
  reqs:
  - AEG-511
  inject:
    target: nav
    action: depart
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: TRAVELLING
      nav.moving: true
- id: D10_S21
  title: Vehicle arrives and stops at the destination
  reqs:
  - AEG-507
  inject:
    target: nav
    action: arrive
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: AT_DESTINATION
      nav.moving: false
      allowed.release.allowed: true
- id: D10_S22
  title: Operator confirms release; payload released and delivered
  reqs:
  - AEG-507
  - OI-003
  ui:
    command: release
    confirmed: true
    args: {}
  expect:
    within_s: 10
    result:
      accepted: true
    snapshot:
      payload.state: DELIVERED
- id: D10_S23
  title: Delivery confirmed within 10 s to the operator and Team 1, with a summary
  reqs:
  - AEG-508
  - OI-016
  - AEG-510
  expect:
    within_s: 3
    snapshot:
      delivery.confirm_latency_s:
        lt: 10
      delivery.payload_id:
        contains: PAY-
    log:
      kind: msg.sent
      env.type: t1.delivery_confirmation
      min_count: 10

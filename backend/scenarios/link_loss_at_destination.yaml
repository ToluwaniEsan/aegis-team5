name: link_loss_at_destination
description: Compare destination link loss with and without pre-authorization.
steps:
- id: S01
  title: Start-up shows the link status
  reqs:
  - OI-007
  expect:
    within_s: 3
    snapshot:
      link.state: CONNECTED
      payload.state: EMPTY
      payload.updated_at:
        not: null
- id: S02
  title: Operator assigns a mission; payload ID generated by the system
  reqs:
  - OI-001
  - AEG-510
  ui:
    command: assign_mission
    confirmed: false
    args:
      origin_id: FOB_ALPHA
      destination_id: OP_BRAVO
      priority: PRIORITY
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
      prerelease_authorized: false
  expect:
    within_s: 2
    result:
      accepted: true
    snapshot:
      mission.active.payload_id:
        contains: PAY-
      mission.active.destination.id: OP_BRAVO
- id: S04
  title: Payload secured, weight within 0.5 kg, departure permitted
  reqs:
  - AEG-504
  - AEG-505
  - AEG-511
  expect:
    within_s: 8
    snapshot:
      payload.state: SECURED
      payload.secured: true
      payload.mass_kg:
        gt: 741.5
        lt: 742.5
      payload.departure_permitted: true
- id: S07
  title: Vehicle departs
  reqs:
  - AEG-511
  inject:
    target: nav
    action: depart
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: TRAVELLING
      nav.moving: true
- id: S21
  title: Vehicle arrives and stops at the destination
  reqs:
  - AEG-507
  inject:
    target: nav
    action: arrive
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: AT_DESTINATION
      nav.moving: false
      allowed.release.allowed: true
- id: L01
  title: Lose the link at destination without pre-authorization
  reqs:
  - AEG-514
  inject:
    target: link
    action: outage
    params:
      seconds: 20
  expect:
    within_s: 8
    snapshot:
      link.state: LOST
- id: L02
  title: Wait beyond the pre-release interval
  reqs:
  - AEG-514
  wait_s: 25
  expect:
    within_s: 5
    snapshot:
      link.state: CONNECTED
      payload.state: AT_DESTINATION
      payload.prerelease_authorized: false
- id: L03
  title: Release after the link returns
  reqs:
  - AEG-507
  ui:
    command: release
    confirmed: true
    args: {}
  expect:
    within_s: 10
    result:
      accepted: true
    snapshot:
      payload.state: DELIVERED
- id: BS02
  title: Operator assigns a mission; payload ID generated by the system
  reqs:
  - OI-001
  - AEG-510
  ui:
    command: assign_mission
    confirmed: false
    args:
      origin_id: FOB_ALPHA
      destination_id: OP_BRAVO
      priority: PRIORITY
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
      prerelease_authorized: true
  expect:
    within_s: 2
    result:
      accepted: true
    snapshot:
      mission.active.payload_id:
        contains: PAY-
      mission.active.destination.id: OP_BRAVO
- id: BS04
  title: Payload secured, weight within 0.5 kg, departure permitted
  reqs:
  - AEG-504
  - AEG-505
  - AEG-511
  expect:
    within_s: 8
    snapshot:
      payload.state: SECURED
      payload.secured: true
      payload.mass_kg:
        gt: 741.5
        lt: 742.5
      payload.departure_permitted: true
- id: BS07
  title: Vehicle departs
  reqs:
  - AEG-511
  inject:
    target: nav
    action: depart
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: TRAVELLING
      nav.moving: true
- id: BS21
  title: Vehicle arrives and stops at the destination
  reqs:
  - AEG-507
  inject:
    target: nav
    action: arrive
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: AT_DESTINATION
      nav.moving: false
      allowed.release.allowed: true
- id: L05
  title: Lose the link at destination with pre-authorization
  reqs:
  - AEG-507
  inject:
    target: link
    action: outage
    params:
      seconds: 20
  expect:
    within_s: 8
    snapshot:
      link.state: LOST
- id: L06
  title: After reconnect observe automatic release and delivery
  reqs:
  - AEG-507
  wait_s: 25
  expect:
    within_s: 5
    snapshot:
      link.state: CONNECTED
      payload.state: DELIVERED

name: faults
description: Injectable fault subset; full catalog and repeated trials remain outstanding.
steps:
- id: S01
  title: Start-up shows the link status
  reqs:
  - OI-007
  expect:
    within_s: 3
    snapshot:
      link.state: CONNECTED
      payload.state: EMPTY
      payload.updated_at:
        not: null
- id: S02
  title: Operator assigns a mission; payload ID generated by the system
  reqs:
  - OI-001
  - AEG-510
  ui:
    command: assign_mission
    confirmed: false
    args:
      origin_id: FOB_ALPHA
      destination_id: OP_BRAVO
      priority: PRIORITY
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
      prerelease_authorized: false
  expect:
    within_s: 2
    result:
      accepted: true
    snapshot:
      mission.active.payload_id:
        contains: PAY-
      mission.active.destination.id: OP_BRAVO
- id: S04
  title: Payload secured, weight within 0.5 kg, departure permitted
  reqs:
  - AEG-504
  - AEG-505
  - AEG-511
  expect:
    within_s: 8
    snapshot:
      payload.state: SECURED
      payload.secured: true
      payload.mass_kg:
        gt: 741.5
        lt: 742.5
      payload.departure_permitted: true
- id: RAISE_PAYLOAD_SHIFT
  title: Raise PAYLOAD_SHIFT
  reqs:
  - AEG-502
  - AEG-505
  - OI-010
  inject:
    target: payload
    action: shift
    params:
      cm: 3.1
  expect:
    within_s: 2
    alert:
      code: PAYLOAD_SHIFT
      severity: WARNING
      acknowledged: false
      recommended_action:
        not: ''
    snapshot:
      payload.secured: false
- id: ACK_PAYLOAD_SHIFT
  title: Acknowledge PAYLOAD_SHIFT
  reqs:
  - AEG-502
  - AEG-505
  - OI-010
  ui:
    command: ack_fault
    confirmed: false
    args:
      alert_id: $alert.PAYLOAD_SHIFT
  expect:
    within_s: 3
    alert:
      code: PAYLOAD_SHIFT
      acknowledged: true
- id: CLEAR_PAYLOAD_SHIFT
  title: Clear PAYLOAD_SHIFT
  reqs:
  - AEG-502
  - AEG-505
  - OI-010
  inject:
    target: payload
    action: shift
    params:
      cm: 0.2
  expect:
    within_s: 4
    no_alert:
      code: PAYLOAD_SHIFT
    snapshot:
      payload.secured: true

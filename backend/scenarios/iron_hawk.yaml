# scenarios/iron_hawk.yaml : DRAFT for Workstream B (task B15). A and C review it.
# Operation IRON HAWK (handbook section 13) following our CONOPS steps.
# Run: python -m aegis.testing.scenario_runner scenarios/iron_hawk.yaml --fast   (CI)
#      python -m aegis.testing.scenario_runner scenarios/iron_hawk.yaml --live   (demo, against run_all)
# Format: docs/06-integration-and-test.md section 2.

name: iron_hawk
description: Full IRON HAWK mission with degraded comms, outage, reroute, payload change, new mission and a payload fault.

steps:
  - id: S01
    title: Start-up shows the link status
    reqs: [OI-007]
    expect:
      within_s: 3
      snapshot: {link.state: CONNECTED, payload.state: EMPTY}

  - id: S02
    title: Operator assigns a mission; payload ID generated by the system
    reqs: [OI-001, AEG-510]
    ui:
      command: assign_mission
      confirmed: false
      args:
        origin_id: FOB_ALPHA
        destination_id: OP_BRAVO
        priority: PRIORITY
        declared_mass_kg: 742
        dims_cm: {length: 58, width: 38, height: 36}
        prerelease_authorized: false
    expect:
      within_s: 2
      result: {accepted: true}
      snapshot: {mission.active.payload_id: {contains: "PAY-"}, mission.active.destination.id: OP_BRAVO}

  - id: S03
    title: Payload loaded and weighed
    reqs: [AEG-503, AEG-504]
    expect:
      within_s: 4
      snapshot: {payload.state: LOADED}

  - id: S04
    title: Payload secured, weight within 0.5 kg, departure permitted
    reqs: [AEG-504, AEG-505, AEG-511]
    expect:
      within_s: 8
      snapshot:
        payload.state: SECURED
        payload.secured: true
        payload.mass_kg: {gt: 741.5, lt: 742.5}
        payload.departure_permitted: true

  - id: S05
    title: Payload requirement changes within bounds, before departure
    reqs: [AEG-512]
    ui:
      command: update_payload
      confirmed: false
      args: {declared_mass_kg: 810, dims_cm: {length: 58, width: 38, height: 36}}
    expect:
      within_s: 10
      result: {accepted: true}
      snapshot: {payload.state: SECURED, payload.mass_kg: {gt: 809.5, lt: 810.5}}
      log: {kind: msg.sent, env.type: payload.mass_report, min_count: 2}

  - id: S06
    title: A change over the limit is refused with a reason
    reqs: [AEG-501, OI-004]
    ui:
      command: update_payload
      confirmed: false
      args: {declared_mass_kg: 1180, dims_cm: {length: 58, width: 38, height: 36}}
    expect:
      within_s: 2
      result: {accepted: false, reason: {contains: "exceeds"}}

  - id: S07
    title: Vehicle departs
    reqs: [AEG-511]
    inject: {target: nav, action: depart, params: {}}
    expect:
      within_s: 3
      snapshot: {payload.state: TRAVELLING, nav.moving: true}

  - id: S08
    title: Release is refused while moving; status updates every second
    reqs: [AEG-506, OI-004, OI-005]
    ui:
      command: release
      confirmed: true
      args: {}
    expect:
      within_s: 2
      result: {accepted: false, reason: {contains: "moving"}}
      snapshot: {allowed.release.allowed: false, nav.age_s: {lt: 2}, payload.age_s: {lt: 2}}

  - id: S09
    title: Communications degrade
    reqs: [OI-007]
    inject: {target: link, action: set, params: {latency_ms: 1500, loss_pct: 0}}
    expect:
      within_s: 3
      snapshot: {link.state: DEGRADED}
      alert: {code: LINK_DEGRADED, severity: CAUTION}

  - id: S10
    title: Each value shows its age while degraded
    reqs: [OI-017]
    expect:
      within_s: 3
      snapshot: {payload.age_s: {gt: 1}, payload.stale: false}

  - id: S11
    title: Link outage begins
    reqs: [OI-008]
    inject: {target: link, action: outage, params: {seconds: 15}}

  - id: S12
    title: A command sent during the outage fails at 5 s and is not resent
    reqs: [OI-009, OI-006]
    ui:
      command: change_destination
      confirmed: true
      args: {destination_id: OP_CHARLIE}
    expect:
      within_s: 8
      result: {accepted: true}
      snapshot: {commands.0.command: change_destination, commands.0.state: FAILED}

  - id: S13
    title: Link LOST; last known values shown and marked OUT OF DATE
    reqs: [OI-007, OI-008, OI-017]
    expect:
      within_s: 8
      snapshot: {link.state: LOST, payload.stale: true, payload.state: TRAVELLING}
      alert: {code: LINK_LOST, severity: WARNING}

  - id: S14
    title: Link returns; the failed command was never resent; still heading to Outpost Bravo
    reqs: [OI-009]
    inject: {target: link, action: set, params: {latency_ms: 80, loss_pct: 0}}
    expect:
      within_s: 15
      snapshot: {link.state: CONNECTED, payload.stale: false, nav.destination.id: OP_BRAVO}
      log: {kind: msg.sent, env.type: cmd.change_destination, count: 1}

  - id: S15
    title: Primary route becomes unavailable; new route and ETA shown
    reqs: [OI-012]
    inject: {target: nav, action: block_route, params: {reason: "Bridge out at grid 4471"}}
    expect:
      within_s: 3
      snapshot: {nav.blocked.reason: {contains: "Bridge"}}
      alert: {code: ROUTE_BLOCKED, severity: CAUTION}

  - id: S16
    title: Operator issues a new mission during the active one
    reqs: [OI-015]
    ui:
      command: assign_mission
      confirmed: false
      args:
        origin_id: FOB_ALPHA
        destination_id: LZ_DELTA
        priority: ROUTINE
        declared_mass_kg: 600
        dims_cm: {length: 50, width: 30, height: 30}
        prerelease_authorized: false
    expect:
      within_s: 2
      result: {accepted: true}

  - id: S17
    title: The new mission is queued and the active mission continues
    reqs: [OI-015]
    expect:
      within_s: 2
      snapshot: {mission.queue: {len: 1}, mission.active.destination.id: OP_BRAVO}

  - id: S18
    title: Simulated payload fault (3.1 cm shift) reaches the operator within 2 s, payload shown as unsecured
    reqs: [AEG-502, AEG-505, OI-010]
    inject: {target: payload, action: shift, params: {cm: 3.1}}
    expect:
      within_s: 2
      alert: {code: PAYLOAD_SHIFT, severity: WARNING, acknowledged: false}
      snapshot: {payload.secured: false}

  - id: S19
    title: The payload fault is reported to Team 1
    reqs: [AEG-513]
    expect:
      within_s: 2
      log: {kind: msg.sent, env.type: t1.fault_report, min_count: 1}

  - id: S20
    title: Operator acknowledges; condition clears
    reqs: [OI-002, OI-010]
    ui:
      command: ack_fault
      confirmed: false
      args: {alert_id: "$alert.PAYLOAD_SHIFT"}
    expect:
      within_s: 3
      alert: {code: PAYLOAD_SHIFT, acknowledged: true}

  - id: S20b
    title: Shift returns to normal; alert leaves the list
    reqs: [AEG-502]
    inject: {target: payload, action: shift, params: {cm: 0.2}}
    expect:
      within_s: 3
      no_alert: {code: PAYLOAD_SHIFT}
      snapshot: {payload.secured: true}

  - id: S21
    title: Vehicle arrives and stops at the destination
    reqs: [AEG-507]
    inject: {target: nav, action: arrive, params: {}}
    expect:
      within_s: 3
      snapshot: {payload.state: AT_DESTINATION, nav.moving: false, allowed.release.allowed: true}

  - id: S22
    title: Operator confirms release; payload released and delivered
    reqs: [AEG-507, OI-003]
    ui:
      command: release
      confirmed: true
      args: {}
    expect:
      within_s: 10
      result: {accepted: true}
      snapshot: {payload.state: DELIVERED}

  - id: S23
    title: Delivery confirmed within 10 s to the operator and Team 1, with a summary
    reqs: [AEG-508, OI-016, AEG-510]
    expect:
      within_s: 3
      snapshot: {delivery.confirm_latency_s: {lt: 10}, delivery.payload_id: {contains: "PAY-"}}
      log: {kind: msg.sent, env.type: t1.delivery_confirmation, min_count: 1}

  - id: S24
    title: The queued mission does not start on its own
    reqs: [OI-015]
    wait_s: 10
    expect:
      within_s: 1
      snapshot: {mission.active: null, mission.queue: {len: 1}, allowed.start_queued_mission.allowed: true}

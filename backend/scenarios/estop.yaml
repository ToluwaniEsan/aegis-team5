name: estop
description: Emergency stop, acknowledgement and recovery in each non-HELD payload
  state.
steps:
- id: S01
  title: Start-up shows the link status
  reqs:
  - OI-007
  expect:
    within_s: 3
    snapshot:
      link.state: CONNECTED
      payload.state: EMPTY
      payload.updated_at:
        not: null
- id: E_EMPTY
  title: Emergency stop in EMPTY
  reqs:
  - OI-019
  ui:
    command: estop
    confirmed: false
    args: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: HELD
      payload.held_from: EMPTY
      estop_active: true
    alert:
      code: ESTOP_ACTIVE
      severity: CRITICAL
- id: ACK_EMPTY
  title: Acknowledge stop from EMPTY
  reqs:
  - OI-019
  ui:
    command: ack_fault
    confirmed: false
    args:
      alert_id: $alert.ESTOP_ACTIVE
  expect:
    within_s: 3
    snapshot:
      estop_active: false
    no_alert:
      code: ESTOP_ACTIVE
- id: S02
  title: Operator assigns a mission; payload ID generated by the system
  reqs:
  - OI-001
  - AEG-510
  ui:
    command: assign_mission
    confirmed: false
    args:
      origin_id: FOB_ALPHA
      destination_id: OP_BRAVO
      priority: PRIORITY
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
      prerelease_authorized: false
  expect:
    within_s: 2
    result:
      accepted: true
    snapshot:
      mission.active.payload_id:
        contains: PAY-
      mission.active.destination.id: OP_BRAVO
- id: S03
  title: Payload loaded and weighed
  reqs:
  - AEG-503
  - AEG-504
  expect:
    within_s: 4
    snapshot:
      payload.state: LOADED
- id: E_LOADED
  title: Emergency stop in LOADED
  reqs:
  - OI-019
  ui:
    command: estop
    confirmed: false
    args: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: HELD
      payload.held_from: LOADED
      estop_active: true
    alert:
      code: ESTOP_ACTIVE
      severity: CRITICAL
- id: ACK_LOADED
  title: Acknowledge stop from LOADED
  reqs:
  - OI-019
  ui:
    command: ack_fault
    confirmed: false
    args:
      alert_id: $alert.ESTOP_ACTIVE
  expect:
    within_s: 3
    snapshot:
      estop_active: false
    no_alert:
      code: ESTOP_ACTIVE
- id: S04
  title: Payload secured, weight within 0.5 kg, departure permitted
  reqs:
  - AEG-504
  - AEG-505
  - AEG-511
  expect:
    within_s: 8
    snapshot:
      payload.state: SECURED
      payload.secured: true
      payload.mass_kg:
        gt: 741.5
        lt: 742.5
      payload.departure_permitted: true
- id: E_SECURED
  title: Emergency stop in SECURED
  reqs:
  - OI-019
  ui:
    command: estop
    confirmed: false
    args: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: HELD
      payload.held_from: SECURED
      estop_active: true
    alert:
      code: ESTOP_ACTIVE
      severity: CRITICAL
- id: ACK_SECURED
  title: Acknowledge stop from SECURED
  reqs:
  - OI-019
  ui:
    command: ack_fault
    confirmed: false
    args:
      alert_id: $alert.ESTOP_ACTIVE
  expect:
    within_s: 3
    snapshot:
      estop_active: false
    no_alert:
      code: ESTOP_ACTIVE
- id: S07
  title: Vehicle departs
  reqs:
  - AEG-511
  inject:
    target: nav
    action: depart
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: TRAVELLING
      nav.moving: true
- id: E_TRAVELLING
  title: Emergency stop in TRAVELLING
  reqs:
  - OI-019
  ui:
    command: estop
    confirmed: false
    args: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: HELD
      payload.held_from: TRAVELLING
      estop_active: true
    alert:
      code: ESTOP_ACTIVE
      severity: CRITICAL
- id: E_HELD
  title: Emergency stop can be sent again while HELD
  reqs:
  - OI-019
  ui:
    command: estop
    confirmed: false
    args: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: HELD
      payload.held_from: TRAVELLING
      estop_active: true
    alert:
      code: ESTOP_ACTIVE
      severity: CRITICAL
- id: ACK_TRAVELLING
  title: Acknowledge stop from TRAVELLING
  reqs:
  - OI-019
  ui:
    command: ack_fault
    confirmed: false
    args:
      alert_id: $alert.ESTOP_ACTIVE
  expect:
    within_s: 3
    snapshot:
      estop_active: false
    no_alert:
      code: ESTOP_ACTIVE
- id: S21
  title: Vehicle arrives and stops at the destination
  reqs:
  - AEG-507
  inject:
    target: nav
    action: arrive
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: AT_DESTINATION
      nav.moving: false
      allowed.release.allowed: true
- id: E_AT_DESTINATION
  title: Emergency stop in AT_DESTINATION
  reqs:
  - OI-019
  ui:
    command: estop
    confirmed: false
    args: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: HELD
      payload.held_from: AT_DESTINATION
      estop_active: true
    alert:
      code: ESTOP_ACTIVE
      severity: CRITICAL
- id: ACK_AT_DESTINATION
  title: Acknowledge stop from AT_DESTINATION
  reqs:
  - OI-019
  ui:
    command: ack_fault
    confirmed: false
    args:
      alert_id: $alert.ESTOP_ACTIVE
  expect:
    within_s: 3
    snapshot:
      estop_active: false
    no_alert:
      code: ESTOP_ACTIVE
- id: S22
  title: Operator confirms release; payload released and delivered
  reqs:
  - AEG-507
  - OI-003
  ui:
    command: release
    confirmed: true
    args: {}
  expect:
    within_s: 10
    result:
      accepted: true
    snapshot:
      payload.state: RELEASED
- id: E_RELEASED
  title: Emergency stop in RELEASED
  reqs:
  - OI-019
  ui:
    command: estop
    confirmed: false
    args: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: HELD
      payload.held_from: RELEASED
      estop_active: true
    alert:
      code: ESTOP_ACTIVE
      severity: CRITICAL
- id: ACK_RELEASED
  title: Acknowledge stop from RELEASED
  reqs:
  - OI-019
  ui:
    command: ack_fault
    confirmed: false
    args:
      alert_id: $alert.ESTOP_ACTIVE
  expect:
    within_s: 3
    snapshot:
      estop_active: false
    no_alert:
      code: ESTOP_ACTIVE
- id: S23
  title: Delivery confirmed within 10 s to the operator and Team 1, with a summary
  reqs:
  - AEG-508
  - OI-016
  - AEG-510
  expect:
    within_s: 6
    snapshot:
      delivery.confirm_latency_s:
        lt: 10
      delivery.payload_id:
        contains: PAY-
    log:
      kind: msg.sent
      env.type: t1.delivery_confirmation
      min_count: 1
- id: E_DELIVERED
  title: Emergency stop in DELIVERED
  reqs:
  - OI-019
  ui:
    command: estop
    confirmed: false
    args: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: HELD
      payload.held_from: DELIVERED
      estop_active: true
    alert:
      code: ESTOP_ACTIVE
      severity: CRITICAL
- id: ACK_DELIVERED
  title: Acknowledge stop from DELIVERED
  reqs:
  - OI-019
  ui:
    command: ack_fault
    confirmed: false
    args:
      alert_id: $alert.ESTOP_ACTIVE
  expect:
    within_s: 3
    snapshot:
      estop_active: false
    no_alert:
      code: ESTOP_ACTIVE
- id: RS02
  title: Operator assigns a mission; payload ID generated by the system
  reqs:
  - OI-001
  - AEG-510
  ui:
    command: assign_mission
    confirmed: false
    args:
      origin_id: FOB_ALPHA
      destination_id: OP_BRAVO
      priority: PRIORITY
      declared_mass_kg: 742
      dims_cm:
        length: 58
        width: 38
        height: 36
      prerelease_authorized: false
  expect:
    within_s: 2
    result:
      accepted: true
    snapshot:
      mission.active.payload_id:
        contains: PAY-
      mission.active.destination.id: OP_BRAVO
- id: RS04
  title: Payload secured, weight within 0.5 kg, departure permitted
  reqs:
  - AEG-504
  - AEG-505
  - AEG-511
  expect:
    within_s: 8
    snapshot:
      payload.state: SECURED
      payload.secured: true
      payload.mass_kg:
        gt: 741.5
        lt: 742.5
      payload.departure_permitted: true
- id: RS07
  title: Vehicle departs
  reqs:
  - AEG-511
  inject:
    target: nav
    action: depart
    params: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: TRAVELLING
      nav.moving: true
- id: R01
  title: Move away from origin
  reqs:
  - OI-019
  wait_s: 3
- id: R02
  title: Abort while travelling
  reqs:
  - OI-019
  ui:
    command: abort
    confirmed: true
    args: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: RETURNING
- id: E_RETURNING
  title: Emergency stop while returning
  reqs:
  - OI-019
  ui:
    command: estop
    confirmed: false
    args: {}
  expect:
    within_s: 3
    snapshot:
      payload.state: HELD
      payload.held_from: RETURNING
      estop_active: true
    alert:
      code: ESTOP_ACTIVE
      severity: CRITICAL
- id: ACK_RETURNING
  title: Acknowledge stop while returning
  reqs:
  - OI-019
  ui:
    command: ack_fault
    confirmed: false
    args:
      alert_id: $alert.ESTOP_ACTIVE
  expect:
    within_s: 3
    snapshot:
      estop_active: false
      payload.state: RETURNING
    no_alert:
      code: ESTOP_ACTIVE
